name: Refresh profile artwork

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install portrait dependency
        run: python -m pip install -r scripts/profile/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile scripts/profile/update_art.py
      - name: Generate and validate artwork
        run: python scripts/profile/update_art.py
      - name: Commit changed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-terminal.svg assets/contribution-calendar.svg data/contributions.json README.md
          if git diff --cached --quiet; then
            echo "Artwork is current."
            exit 0
          fi
          git commit -m "Refresh profile artwork [skip ci]"
          git push origin HEAD:main
